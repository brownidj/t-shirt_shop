{% load display_tags %}
{% load i18n %}

{% if paginator.num_pages > 1 %}
    <nav aria-label="{% trans 'Catalogue pages' %}">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item">
                {% if page_obj.has_previous %}
                    <a class="page-link" href="?{% get_parameters 'page' %}page={{ page_obj.previous_page_number }}" aria-label="{% trans 'Previous page' %}">&lsaquo;</a>
                {% else %}
                    <a class="page-link" href="?{% get_parameters 'page' %}page={{ paginator.num_pages }}" aria-label="{% trans 'Previous page' %}">&lsaquo;</a>
                {% endif %}
            </li>
            <li class="page-item disabled">
                <span class="page-link">{% trans "Page" %} {{ page_obj.number }}/{{ paginator.num_pages }}</span>
            </li>
            <li class="page-item">
                {% if page_obj.has_next %}
                    <a class="page-link" href="?{% get_parameters 'page' %}page={{ page_obj.next_page_number }}" aria-label="{% trans 'Next page' %}">&rsaquo;</a>
                {% else %}
                    <a class="page-link" href="?{% get_parameters 'page' %}page=1" aria-label="{% trans 'Next page' %}">&rsaquo;</a>
                {% endif %}
            </li>
        </ul>
    </nav>
{% endif %}
