{% load i18n %}

{% if user.is_authenticated %}
    <nav id="top_page" class="navbar navbar-light bg-light accounts">
        <div class="container px-0 d-flex justify-content-end">
            {% if user.is_staff or perms.partner.dashboard_access %}
                <a href="{% url 'dashboard:index' %}" class="nav-link mr-2">
                    <i class="fas fa-list-ul mr-2" aria-hidden="true"></i>{% trans "Dashboard" %}
                </a>
            {% endif %}
            <a id="logout_link" href="{% url 'customer:logout' %}" class="nav-link">
                <i class="fas fa-sign-out-alt mr-2" aria-hidden="true"></i>{% trans "Logout" %}
            </a>
        </div>
    </nav>
{% endif %}
