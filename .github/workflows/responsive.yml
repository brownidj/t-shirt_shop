name: Responsive and accessibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  responsive:
    name: Responsive and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPOSITORY_DB_PATH: ${{ github.workspace }}/.responsive-checks.sqlite3

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Prepare the local database
        run: python manage.py migrate --noinput

      - name: Install browser-test packages
        run: npm ci

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check responsive layouts and accessibility
        run: npm run test:responsive:ci

      - name: Save browser and accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
